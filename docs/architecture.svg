<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1130" width="1440" height="1130" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#12171f"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.022" stroke-width="1"/>
    </pattern>
    <linearGradient id="accentbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#a371f7"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8b949e"/>
    </marker>
    <marker id="arwo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9900"/>
    </marker>
    <style>
      .h1{font-size:31px;font-weight:700;fill:#e6edf3;letter-spacing:-.4px}
      .sub{font-size:14px;fill:#8b949e}
      .band{font-size:11px;font-weight:700;letter-spacing:2.4px}
      .nm{font-size:14.5px;font-weight:650;fill:#e6edf3}
      .nmsm{font-size:12.5px;font-weight:650;fill:#e6edf3}
      .cap{font-size:11.5px;fill:#8b949e}
      .mono{font-family:'JetBrains Mono','SF Mono',Consolas,monospace;font-size:11px;fill:#9aa4b0}
      .monol{font-family:'JetBrains Mono','SF Mono',Consolas,monospace;font-size:11.5px;fill:#c9d1d9}
      .tag{font-size:10px;font-weight:700;letter-spacing:1.4px}
      .chip{font-size:12px;font-weight:600;fill:#c9d1d9}
      .chipsm{font-size:10.5px;fill:#8b949e}
      .panel{fill:#0f141b;fill-opacity:.72;stroke:#262d38;stroke-width:1}
      .card{fill:#161b22;stroke:#2b3440;stroke-width:1}
      .foot{font-size:11.5px;fill:#6e7681}
    </style>
  </defs>

  <rect width="1440" height="1130" fill="url(#bg)"/>
  <rect width="1440" height="1130" fill="url(#grid)"/>
  <rect x="0" y="0" width="1440" height="4" fill="url(#accentbar)"/>

  <!-- ================= HEADER ================= -->
  <text x="40" y="58" class="h1">Home Infrastructure Lab</text>
  <text x="40" y="84" class="sub">2-node Proxmox VE cluster · external quorum witness · segmented 10 Gb network · 3-tier encrypted backup to cold cloud storage</text>
  <line x1="40" y1="102" x2="1400" y2="102" stroke="#262d38"/>

  <!-- ================= BAND 1 : EDGE &amp; NETWORK ================= -->
  <rect x="40" y="120" width="1360" height="230" rx="12" class="panel"/>
  <text x="68" y="146" class="band" fill="#58a6ff">EDGE &amp; NETWORK</text>

  <!-- internet -->
  <rect x="68" y="170" width="150" height="76" rx="9" class="card"/>
  <rect x="68" y="170" width="3" height="76" rx="1.5" fill="#58a6ff"/>
  <text x="86" y="199" class="nmsm">Internet</text>
  <text x="86" y="219" class="mono">2.5 Gb cable WAN</text>
  <text x="86" y="235" class="mono">SFP+ handoff</text>

  <!-- pfSense -->
  <rect x="316" y="170" width="190" height="76" rx="9" fill="#1c1417" stroke="#5c2b30"/>
  <rect x="316" y="170" width="3" height="76" rx="1.5" fill="#f85149"/>
  <text x="334" y="196" class="nmsm">Firewall / Gateway</text>
  <text x="334" y="216" class="mono">pfSense · WireGuard VPN</text>
  <rect x="334" y="224" width="30" height="15" rx="4" fill="#f85149" fill-opacity=".16" stroke="#f85149" stroke-opacity=".45"/>
  <text x="339" y="235" class="tag" fill="#f85149">VM</text>
  <text x="372" y="235" class="mono" font-size="10">runs on the cluster it protects</text>

  <!-- core switch -->
  <rect x="604" y="170" width="200" height="76" rx="9" class="card"/>
  <rect x="604" y="170" width="3" height="76" rx="1.5" fill="#58a6ff"/>
  <text x="622" y="196" class="nmsm">Core Aggregation Switch</text>
  <text x="622" y="216" class="mono">10 Gb SFP+ DAC backbone</text>
  <text x="622" y="232" class="mono">trunks all VLANs</text>

  <!-- access switch -->
  <rect x="902" y="170" width="200" height="76" rx="9" class="card"/>
  <rect x="902" y="170" width="3" height="76" rx="1.5" fill="#58a6ff"/>
  <text x="920" y="196" class="nmsm">24-port PoE Switch</text>
  <text x="920" y="216" class="mono">20 Gb aggregated uplink</text>
  <text x="920" y="232" class="mono">edge + PoE devices</text>

  <!-- wifi -->
  <rect x="1200" y="170" width="170" height="76" rx="9" class="card"/>
  <rect x="1200" y="170" width="3" height="76" rx="1.5" fill="#58a6ff"/>
  <text x="1218" y="196" class="nmsm">Wi-Fi 7 APs ×2</text>
  <text x="1218" y="216" class="mono">2.5 Gb uplink</text>
  <text x="1218" y="232" class="mono">per-VLAN SSIDs</text>

  <line x1="230" y1="208" x2="304" y2="208" stroke="#8b949e" stroke-width="1.4" marker-end="url(#arw)"/>
  <line x1="518" y1="208" x2="592" y2="208" stroke="#8b949e" stroke-width="1.4" marker-end="url(#arw)"/>
  <line x1="816" y1="208" x2="890" y2="208" stroke="#8b949e" stroke-width="1.4" marker-end="url(#arw)"/>
  <line x1="1114" y1="208" x2="1188" y2="208" stroke="#8b949e" stroke-width="1.4" marker-end="url(#arw)"/>

  <!-- vlan bracket -->
  <path d="M704 246 L704 262 M68 262 L1370 262" fill="none" stroke="#3d4653" stroke-width="1.2"/>
  <path d="M188 262 L188 272 M454 262 L454 272 M720 262 L720 272 M986 262 L986 272 M1252 262 L1252 272" stroke="#3d4653" stroke-width="1.2"/>

  <g>
    <rect x="68" y="272" width="240" height="48" rx="8" fill="#131a24" stroke="#2b3440"/>
    <text x="84" y="292" class="chip">Management</text>
    <text x="84" y="309" class="chipsm">out-of-band controllers · UPS</text>

    <rect x="334" y="272" width="240" height="48" rx="8" fill="#131a24" stroke="#2b3440"/>
    <text x="350" y="292" class="chip">Cameras</text>
    <text x="350" y="309" class="chipsm">isolated · no outbound</text>

    <rect x="600" y="272" width="240" height="48" rx="8" fill="#131a24" stroke="#2b3440"/>
    <text x="616" y="292" class="chip">IoT</text>
    <text x="616" y="309" class="chipsm">untrusted device segment</text>

    <rect x="866" y="272" width="240" height="48" rx="8" fill="#131a24" stroke="#2b3440"/>
    <text x="882" y="292" class="chip">Guest</text>
    <text x="882" y="309" class="chipsm">internet-only, no lateral</text>

    <rect x="1132" y="272" width="240" height="48" rx="8" fill="#131a24" stroke="#2b3440"/>
    <text x="1148" y="292" class="chip">User / Default</text>
    <text x="1148" y="309" class="chipsm">workstations · services</text>
  </g>
  <text x="1370" y="146" class="band" fill="#3d4653" text-anchor="end">ZERO-TRUST VLAN SEGMENTATION</text>

  <line x1="720" y1="350" x2="720" y2="368" stroke="#8b949e" stroke-width="1.4" marker-end="url(#arw)"/>

  <!-- ================= BAND 2 : COMPUTE &amp; STORAGE ================= -->
  <rect x="40" y="370" width="1360" height="360" rx="12" class="panel"/>
  <text x="68" y="396" class="band" fill="#e57000">COMPUTE &amp; STORAGE</text>

  <!-- proxmox cluster -->
  <rect x="68" y="415" width="640" height="255" rx="10" fill="#1a1410" stroke="#4a3520" stroke-dasharray="5 4"/>
  <text x="90" y="440" class="nm" fill="#e57000">Proxmox VE Cluster</text>
  <text x="300" y="440" class="cap">2 physical members</text>

  <rect x="92" y="452" width="280" height="200" rx="9" class="card"/>
  <rect x="92" y="452" width="3" height="200" rx="1.5" fill="#e57000"/>
  <text x="110" y="478" class="tag" fill="#e57000">NODE 1</text>
  <text x="110" y="500" class="nm">Dell R430</text>
  <line x1="110" y1="512" x2="352" y2="512" stroke="#2b3440"/>
  <text x="110" y="532" class="mono">2× Xeon E5-2683 v4 · 32c / 64t</text>
  <text x="110" y="551" class="mono">64 GB RAM</text>
  <text x="110" y="570" class="mono">4× 8 TB SAS · RAID5 ≈ 24 TB</text>
  <rect x="110" y="586" width="156" height="18" rx="5" fill="#f85149" fill-opacity=".14" stroke="#f85149" stroke-opacity=".4"/>
  <text x="119" y="599" class="tag" fill="#f85149">HOSTS FIREWALL VM</text>
  <text x="110" y="625" class="mono" font-size="10" fill="#6e7681">NVR pinned here — local disk</text>
  <text x="110" y="640" class="mono" font-size="10" fill="#6e7681">passthrough, cannot migrate</text>

  <rect x="404" y="452" width="280" height="200" rx="9" class="card"/>
  <rect x="404" y="452" width="3" height="200" rx="1.5" fill="#e57000"/>
  <text x="422" y="478" class="tag" fill="#e57000">NODE 3</text>
  <text x="422" y="500" class="nm">Dell R740xd</text>
  <line x1="422" y1="512" x2="664" y2="512" stroke="#2b3440"/>
  <text x="422" y="532" class="mono">2× Xeon Platinum 8160 · 48c / 96t</text>
  <text x="422" y="551" class="mono">192 GB RAM</text>
  <text x="422" y="570" class="mono">2× 1 TB SSD · RAID1 ≈ 1 TB</text>
  <rect x="422" y="586" width="116" height="18" rx="5" fill="#e57000" fill-opacity=".14" stroke="#e57000" stroke-opacity=".4"/>
  <text x="431" y="599" class="tag" fill="#e57000">HEAVY COMPUTE</text>
  <text x="422" y="625" class="mono" font-size="10" fill="#6e7681">SSD is the binding constraint —</text>
  <text x="422" y="640" class="mono" font-size="10" fill="#6e7681">bulk data lives on the array →</text>

  <!-- file server -->
  <rect x="740" y="415" width="632" height="255" rx="10" fill="#0f1a19" stroke="#1f4a45"/>
  <text x="762" y="440" class="nm" fill="#2dd4bf">File / Backup Server</text>
  <rect x="960" y="426" width="176" height="18" rx="5" fill="#2dd4bf" fill-opacity=".12" stroke="#2dd4bf" stroke-opacity=".35"/>
  <text x="969" y="439" class="tag" fill="#2dd4bf">NOT A CLUSTER MEMBER</text>

  <rect x="762" y="456" width="588" height="118" rx="9" class="card"/>
  <rect x="762" y="456" width="3" height="118" rx="1.5" fill="#2dd4bf"/>
  <text x="782" y="482" class="tag" fill="#2dd4bf">NODE 2</text>
  <text x="782" y="504" class="nm">Dell R730xd · Ubuntu LTS</text>
  <line x1="782" y1="516" x2="1330" y2="516" stroke="#2b3440"/>
  <text x="782" y="536" class="monol">2× Xeon E5-2697 v3 · 28c / 56t · 128 GB RAM</text>
  <text x="782" y="556" class="monol">26× 1.8 TB SAS · RAID6 — 46.8 TB raw / 43.2 TB usable (≈39 TiB)</text>
  <text x="1330" y="536" class="mono" font-size="10" fill="#6e7681" text-anchor="end">OS on mirrored internal SD</text>
  <text x="1330" y="556" class="mono" font-size="10" fill="#6e7681" text-anchor="end">all bays full</text>

  <rect x="762" y="588" width="186" height="60" rx="8" fill="#131a24" stroke="#2b3440"/>
  <text x="778" y="611" class="chip">Bulk storage</text>
  <text x="778" y="630" class="chipsm">NFS / SMB to the lab</text>

  <rect x="963" y="588" width="186" height="60" rx="8" fill="#131a24" stroke="#2b3440"/>
  <text x="979" y="611" class="chip">Backup server</text>
  <text x="979" y="630" class="chipsm">VM snapshot datastore</text>

  <rect x="1164" y="588" width="186" height="60" rx="8" fill="#131a24" stroke="#2b3440"/>
  <text x="1180" y="611" class="chip">Quorum witness</text>
  <text x="1180" y="630" class="chipsm">votes only · runs no VMs</text>

  <!-- quorum + power strips -->
  <rect x="68" y="684" width="640" height="34" rx="7" fill="#131a24" stroke="#2b3440"/>
  <circle cx="88" cy="701" r="4" fill="#3fb950"/>
  <text x="102" y="705" class="mono" font-size="10.5" fill="#c9d1d9">QUORUM  2 members + 1 external witness = 3 votes, threshold 2</text>

  <rect x="740" y="684" width="632" height="34" rx="7" fill="#131a24" stroke="#2b3440"/>
  <circle cx="760" cy="701" r="4" fill="#d29922"/>
  <text x="774" y="705" class="mono" font-size="10.5" fill="#c9d1d9">POWER  dual UPS, monitored by one daemon — coordinated graceful shutdown at 5 min runtime</text>

  <path d="M708 616 L724 616" stroke="#3d4653" stroke-width="1.4" marker-end="url(#arw)"/>
  <line x1="720" y1="730" x2="720" y2="748" stroke="#8b949e" stroke-width="1.4" marker-end="url(#arw)"/>

  <!-- ================= BAND 3 : SERVICES ================= -->
  <rect x="40" y="750" width="1360" height="125" rx="12" class="panel"/>
  <text x="68" y="776" class="band" fill="#a371f7">CONTAINERIZED SERVICES · DOCKER COMPOSE</text>
  <text x="1370" y="776" class="band" fill="#3d4653" text-anchor="end">15+ SERVICES IN PRODUCTION</text>

  <g>
    <rect x="68" y="792" width="151" height="44" rx="8" fill="#17131f" stroke="#3a2d52"/>
    <text x="80" y="810" class="chip">Media</text><text x="80" y="827" class="chipsm">streaming + mgmt</text>
    <rect x="232" y="792" width="151" height="44" rx="8" fill="#17131f" stroke="#3a2d52"/>
    <text x="244" y="810" class="chip">Home automation</text><text x="244" y="827" class="chipsm">local control</text>
    <rect x="396" y="792" width="151" height="44" rx="8" fill="#17131f" stroke="#3a2d52"/>
    <text x="408" y="810" class="chip">NVR</text><text x="408" y="827" class="chipsm">camera recording</text>
    <rect x="560" y="792" width="151" height="44" rx="8" fill="#17131f" stroke="#3a2d52"/>
    <text x="572" y="810" class="chip">Photos</text><text x="572" y="827" class="chipsm">GPU passthrough</text>
    <rect x="724" y="792" width="151" height="44" rx="8" fill="#17131f" stroke="#3a2d52"/>
    <text x="736" y="810" class="chip">DNS filtering</text><text x="736" y="827" class="chipsm">network-wide</text>
    <rect x="888" y="792" width="151" height="44" rx="8" fill="#17131f" stroke="#3a2d52"/>
    <text x="900" y="810" class="chip">Reverse proxy</text><text x="900" y="827" class="chipsm">internal CA + TLS</text>
    <rect x="1052" y="792" width="151" height="44" rx="8" fill="#17131f" stroke="#3a2d52"/>
    <text x="1064" y="810" class="chip">Secrets vault</text><text x="1064" y="827" class="chipsm">self-hosted</text>
    <rect x="1216" y="792" width="156" height="44" rx="8" fill="#17131f" stroke="#3a2d52"/>
    <text x="1228" y="810" class="chip">Monitoring / feeds</text><text x="1228" y="827" class="chipsm">admin tooling</text>
  </g>
  <text x="68" y="860" class="mono" font-size="10.5" fill="#6e7681">External-facing traffic egresses through a VPN killswitch — a VPN drop fails closed rather than leaking.</text>

  <line x1="720" y1="875" x2="720" y2="893" stroke="#8b949e" stroke-width="1.4" marker-end="url(#arw)"/>

  <!-- ================= BAND 4 : BACKUP ================= -->
  <rect x="40" y="895" width="1360" height="200" rx="12" class="panel"/>
  <text x="68" y="921" class="band" fill="#ff9900">BACKUP PIPELINE · 3 TIERS</text>

  <rect x="68" y="940" width="300" height="118" rx="9" class="card"/>
  <rect x="68" y="940" width="3" height="118" rx="1.5" fill="#3fb950"/>
  <text x="88" y="966" class="tag" fill="#3fb950">TIER 1</text>
  <text x="88" y="988" class="nmsm">VM snapshots</text>
  <text x="88" y="1010" class="mono">nightly · 7 retained</text>
  <text x="88" y="1028" class="mono">dedicated backup server</text>
  <text x="88" y="1046" class="mono" font-size="10" fill="#6e7681">→ local RAID6 datastore</text>

  <rect x="396" y="940" width="300" height="118" rx="9" class="card"/>
  <rect x="396" y="940" width="3" height="118" rx="1.5" fill="#58a6ff"/>
  <text x="416" y="966" class="tag" fill="#58a6ff">TIER 2</text>
  <text x="416" y="988" class="nmsm">Service configs</text>
  <text x="416" y="1010" class="mono">weekly rolling · 5 retained</text>
  <text x="416" y="1028" class="mono">per-service tarballs</text>
  <text x="416" y="1046" class="mono" font-size="10" fill="#6e7681">→ local RAID6 array</text>

  <rect x="724" y="940" width="300" height="118" rx="9" class="card"/>
  <rect x="724" y="940" width="3" height="118" rx="1.5" fill="#ff9900"/>
  <text x="744" y="966" class="tag" fill="#ff9900">TIER 3</text>
  <text x="744" y="988" class="nmsm">Offsite</text>
  <text x="744" y="1010" class="mono">encrypted locally, THEN synced</text>
  <text x="744" y="1028" class="mono">weekly</text>
  <text x="744" y="1046" class="mono" font-size="10" fill="#6e7681">plaintext never leaves the network</text>

  <rect x="1080" y="940" width="292" height="118" rx="9" fill="#1b1610" stroke="#4a3a1c"/>
  <rect x="1080" y="940" width="3" height="118" rx="1.5" fill="#ff9900"/>
  <text x="1100" y="966" class="tag" fill="#ff9900">CLOUD</text>
  <text x="1100" y="988" class="nmsm">Object storage · single region</text>
  <text x="1100" y="1010" class="mono">cold archive class — bulk data</text>
  <text x="1100" y="1028" class="mono">standard class — configs</text>
  <text x="1100" y="1046" class="mono" font-size="10" fill="#6e7681">least-privilege IAM policy</text>

  <line x1="374" y1="999" x2="390" y2="999" stroke="#8b949e" stroke-width="1.4" marker-end="url(#arw)"/>
  <line x1="702" y1="999" x2="718" y2="999" stroke="#8b949e" stroke-width="1.4" marker-end="url(#arw)"/>
  <line x1="1030" y1="999" x2="1074" y2="999" stroke="#ff9900" stroke-width="1.6" marker-end="url(#arwo)"/>
  <text x="1080" y="1080" class="mono" font-size="10" fill="#6e7681" text-anchor="end">Client-side encryption — the storage provider never holds a decryption key.</text>

  <!-- ================= FOOTER ================= -->
  <text x="40" y="1118" class="foot">Addresses, hostnames, and configuration values intentionally omitted from this public diagram.</text>
  <text x="1400" y="1118" class="foot" text-anchor="end">github.com/blackcharger/home-infrastructure-lab</text>
</svg>
